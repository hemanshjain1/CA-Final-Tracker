<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Final Premium Tracker</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-main: #4c0519;
            --text-muted: #9d174d;
            --border-pink: #fbcfe8;
            --fr-color: #ec4899;
            --dt-color: #f43f5e;
            --idt-color: #db2777;
            --audit-color: #f472b6;
            --shadow-md: 0 10px 25px -5px rgba(131, 24, 67, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: 2.2rem;
            color: #831843;
            font-weight: 800;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1rem;
        }

        .metrics-banner {
            background: linear-gradient(135deg, #9d174d 0%, #70062c 100%);
            color: #ffffff;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(131, 24, 67, 0.25);
        }

        .metrics-banner-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            text-transform: uppercase;
            color: #ffe4e6;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #fce7f3;
            font-weight: 600;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .workspace-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .workspace-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border-pink);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
            box-sizing: border-box;
        }

        .panel-title {
            margin: 0 0 20px 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: #831843;
            border-bottom: 2px solid #fce7f3;
            padding-bottom: 8px;
        }

        .subject-block {
            margin-bottom: 20px;
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .subject-identity {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #4c0519;
        }

        .subject-badge {
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
        }

        .subject-counter {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .bar-container {
            background: #ffe4e6;
            border-radius: 9999px;
            height: 16px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            transition: width 0.8s ease-out;
        }

        .visual-chart-box {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 160px;
            padding-top: 16px;
            border-bottom: 2px dashed var(--border-pink);
            margin-bottom: 12px;
        }

        .chart-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
        }

        .chart-pillar {
            width: 100%;
            height: 0%;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: height 0.8s ease-out;
        }

        .chart-percentage-lbl {
            font-size: 0.75rem;
            color: #ffffff;
            font-weight: 800;
            margin-top: 4px;
        }

        .chart-label-name {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 8px;
            color: #831843;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-field input, .form-field select {
            padding: 12px;
            border: 1px solid var(--border-pink);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #ffffff;
            font-weight: 600;
            box-sizing: border-box;
            width: 100%;
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(219, 39, 119, 0.3);
            transition: all 0.2s ease;
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.45);
        }

        .table-scroller {
            max-height: 200px;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--border-pink);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background-color: #ffe4e6;
            color: #831843;
            font-weight: 700;
            padding: 12px 10px;
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #fce7f3;
            background: #ffffff;
            font-weight: 600;
        }

        .remove-row-btn {
            background: none;
            border: none;
            color: #f43f5e;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🌸 My CA Final Progress Hub 🌸</h1>
        <p>🎯 Final Deadline: 31 December</p>
    </header>

    <div class="metrics-banner">
        <div class="metrics-banner-title">✨ Days to Go Countdown & Daily Targets ✨</div>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-value" id="days-left">0</div>
                <div class="metric-label">Days Left</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="hours-left">0.0</div>
                <div class="metric-label">Hours Left</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="daily-pace" style="color: #fef08a;">0.00</div>
                <div class="metric-label">Hrs / Day Needed</div>
            </div>
        </div>
    </div>

    <div class="workspace-layout">
        <div>
            <div class="panel">
                <h2 class="panel-title">📊 Subject wise Progress Metrics</h2>
                
                <div class="subject-block">
                    <div class="subject-header">
                        <span class="subject-badge" style="background-color: var(--fr-color)">FR</span> Financial Reporting</span>
                        <span class="subject-stats" id="fr-stats">0.0 / 90 hrs</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" id="fr-bar" style="background-color: var(--fr-color)"></div>
                    </div>
                </div>

                <div class="subject-block">
                    <div class="subject-header">
